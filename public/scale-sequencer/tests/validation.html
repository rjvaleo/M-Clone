<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scale Sequencer Validation Suite</title>
    <style>
      body {
        font-family: Menlo, Monaco, Consolas, monospace;
        background: #0a0c0e;
        color: #c8d8e0;
        margin: 0;
        padding: 16px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 16px;
        color: #00e5ff;
      }
      p {
        margin: 0 0 12px;
        color: #7a909f;
      }
      .summary {
        margin: 10px 0;
        padding: 8px 10px;
        border: 1px solid #1e2830;
        background: #111418;
      }
      .summary.ok {
        border-color: #2f7a2f;
        color: #a0ff60;
      }
      .summary.bad {
        border-color: #7a2f2f;
        color: #ff8d7a;
      }
      ul {
        margin: 10px 0;
        padding-left: 20px;
      }
      li {
        margin: 4px 0;
      }
      .pass {
        color: #a0ff60;
      }
      .fail {
        color: #ff8d7a;
      }
      iframe {
        width: 1px;
        height: 1px;
        border: 0;
        position: absolute;
        left: -9999px;
      }
    </style>
  </head>
  <body>
    <h1>Scale Sequencer Validation Suite</h1>
    <p>Runs app regression checks in an off-screen iframe.</p>
    <div id="summary" class="summary">Running tests...</div>
    <ul id="results"></ul>
    <iframe id="appFrame" title="scale-sequencer-app"></iframe>
    <script src="validation.js"></script>
  </body>
</html>
